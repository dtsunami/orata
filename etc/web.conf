# /etc/orata/web.conf
# Sourced by orata_web.py. chmod 600 -- contains the admin token.

# Where to listen. This UI edits call routing and runs as the `asterisk`
# user, so it fails closed on 0.0.0.0.
#   127.0.0.1    reach it over an SSH tunnel (safest, default)
#   10.x.x.x     the Pi's WireGuard address -- reachable from your phone
#   192.168.x.x  plain LAN. Fine on a trusted home network.
ORATA_WEB_BIND=127.0.0.1
ORATA_WEB_PORT=8088

# REQUIRED. The server refuses to start without one.
#   head -c 24 /dev/urandom | base64
# Visit http://host:8088/?token=THETOKEN once; it sets a cookie.
ORATA_WEB_TOKEN=

# Set to 1 only if you truly mean to bind 0.0.0.0. You almost certainly
# do not -- there is no TLS here and no port-forward should exist.
ORATA_WEB_ALLOW_ANY_BIND=0

# All writes go through this, so the CLI stays the single source of truth.
ORATA_CNAM_SH=/usr/local/bin/orata-cnam.sh

ORATA_WEB_LOG=/var/log/orata/announce.log

# --- read by the diagnostics and harness pages ------------------------
# The harness fires this directly when you click "fire announcement".
ORATA_ANNOUNCE_SH=/usr/local/bin/orata-announce.sh

# Diagnostics parses these to report Alexa mode, ntfy config and whether
# the voip.ms credentials are still at their stub values. Read-only.
ORATA_ANNOUNCE_CONF=/etc/orata/announce.conf
ORATA_PJSIP_CONF=/etc/asterisk/pjsip.conf

# Number the astdb round-trip test writes and then deletes. Must be one
# that will never call you -- it is briefly present in the blocklist.
ORATA_WEB_PROBE_NUMBER=19999999999

# Scraped by the live channel probes on the Harness tab. This is the file
# named in logger.conf, and it MUST have verbose(5) or the probes see
# nothing -- `core set verbose` affects only the console:
#   orata.log => notice,warning,error,verbose(5)
ORATA_ASTERISK_LOG=/var/log/asterisk/orata.log