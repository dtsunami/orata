# /etc/orata/web.conf
# Sourced by orata-web.py. chmod 600 -- contains the admin token.

# Where to listen. This UI edits call routing and runs as the `asterisk`
# user, so it fails closed on 0.0.0.0.
#   127.0.0.1  reach it over an SSH tunnel (safest, default)
#   10.x.x.x   the Pi's WireGuard address -- reachable from your phone
#   192.168.x.x  plain LAN. Fine on a trusted home network.
ORATA_WEB_BIND=127.0.0.1
ORATA_WEB_PORT=8088

# REQUIRED. The server refuses to start without one.
#   head -c 24 /dev/urandom | base64
# Visit http://host:8088/?token=THETOKEN once; it sets a cookie.
ORATA_WEB_TOKEN=

# Set to 1 only if you truly mean to bind 0.0.0.0. You almost certainly
# do not -- there is no TLS here and no port-forward should exist.
ORATA_WEB_ALLOW_ANY_BIND=0

# All writes go through this, so the CLI stays the single source of truth.
ORATA_CNAM_SH=/usr/local/bin/orata-cnam.sh

ORATA_WEB_LOG=/var/log/orata/announce.log