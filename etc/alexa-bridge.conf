# /etc/orata/alexa-bridge.conf: INI DATA, not shell syntax or announce.conf.
# Install root:asterisk 0640. Review docs/alexa-callback.md before enabling.
[bridge]
enabled = false
acknowledge_spoofable_callback = false
# EXACT received digits: Alexa's telephone CID (may equal your mobile CID).
callback_caller_id =
# Public/main DID: original callers call this number.
destination =
# NEW, different DID: Alexa's Orata contact must dial this number.
# Must match the ALEXABRIDGE_CALLBACK_DID dialplan global.
callback_destination =
# Trusted originating callers on the MAIN DID; comma-separated; no wildcard.
# Your mobile may be listed even when Alexa presents the same caller ID.
allowed_callers =
state_dir = /var/lib/orata/alexa-bridge
audio_socket = /run/orata-audio/play.sock
log = /var/log/orata/alexa-bridge.log
callback_window = 30
call_limit = 900
cooldown = 60

[audio]
socket = /run/orata-audio/play.sock
# Pin a copy outside the timestamped library so retention cannot delete it.
prompt = /var/lib/orata-audio/alexa-call.wav
target = bluez_output.08_EB_ED_71_F9_02.1