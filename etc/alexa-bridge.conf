# /etc/orata/alexa-bridge.conf: INI DATA, not shell syntax or announce.conf.
# Install root:asterisk 0640. Review docs/alexa-callback.md before enabling.
[bridge]
enabled = false
acknowledge_spoofable_callback = false
# EXACT received digits: Alexa's telephone CID and the called home DID.
callback_caller_id =
destination =
# A DIFFERENT trusted originating phone number; comma-separated; no wildcard.
allowed_callers =
state_dir = /var/lib/orata/alexa-bridge
audio_socket = /run/orata-audio/play.sock
log = /var/log/orata/alexa-bridge.log
callback_window = 30
call_limit = 900
cooldown = 60

[audio]
socket = /run/orata-audio/play.sock
# Pin a copy outside the timestamped library so retention cannot delete it.
prompt = /var/lib/orata-audio/alexa-call.wav
target = bluez_output.08_EB_ED_71_F9_02.1