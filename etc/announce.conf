# /etc/orata/announce.conf
# Sourced by orata-announce.sh. chmod 600 -- may reference private topics.

# --- Alexa: which path ------------------------------------------------
# arc    = alexa_remote_control.sh. Dynamic "Call from Mom". Cookie auth,
#          Amazon breaks it ~annually.
# sensor = virtual contact sensor + Routine. Text is static per sensor,
#          auth never rots. See docs/alexa-sensor.md.
# both   = run both (use during migration only -- you will hear double)
# off    = ntfy only
ORATA_ALEXA_MODE=arc

# --- Alexa path A: alexa_remote_control -------------------------------
ORATA_ARC=/usr/local/bin/alexa_remote_control.sh

# ALL = every Echo on the account. Narrow it with exact device names from
# `alexa_remote_control.sh -l`, e.g. "Kitchen"
ORATA_ALEXA_DEVICES=ALL

# announce = chime + all devices at once (what you want for a phone)
# speak    = plain TTS, iterates devices one at a time
ORATA_ALEXA_CMD=announce

# --- Alexa path B: virtual contact sensor -----------------------------
ORATA_SENSOR_SH=/usr/local/bin/orata-alexa-sensor.sh

# Login with Amazon credentials for your Smart Home skill.
# The refresh token is minted by the AcceptGrant exchange in Lambda --
# see docs/alexa-sensor.md for how to get it out of CloudWatch.
ORATA_LWA_CLIENT_ID=
ORATA_LWA_CLIENT_SECRET=
ORATA_LWA_REFRESH_TOKEN=

# Event Gateway by account region:
#   NA  https://api.amazonalexa.com/v3/events
#   EU  https://api.eu.amazonalexa.com/v3/events
#   FE  https://api.fe.amazonalexa.com/v3/events
ORATA_ALEXA_GATEWAY=https://api.amazonalexa.com/v3/events

# Sensor used when the caller has no per-number mapping in astdb.
# Bind this one to a generic "You have a call" Routine.
ORATA_SENSOR_DEFAULT=orata-unknown

# Seconds before resetting the sensor to NOT_DETECTED. It MUST reset or
# the Routine will not fire on the next call.
ORATA_SENSOR_RESET=3

# Cached LWA access token lives here. Must be writable by `asterisk`.
ORATA_STATE_DIR=/var/lib/orata

# --- ntfy fallback ---------------------------------------------------
# Pick an unguessable topic; public ntfy.sh topics are readable by anyone
# who knows the name. Leave empty to disable.
ORATA_NTFY_URL=

# --- behaviour -------------------------------------------------------
# 1 = read out digits of unknown numbers instead of "an unknown number"
ORATA_SPEAK_DIGITS=0

ORATA_LOG=/var/log/orata/announce.log