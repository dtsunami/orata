;
; test/selftest.conf -- native on-Pi dialplan self-test.
;
; Deployed to /etc/asterisk/orata-selftest.conf and pulled in with
; #include. Exercises DB() reads through a REAL channel, which is the
; only way they resolve -- `dialplan eval function` returns Failure(-1)
; outside a channel, and `dialplan add extension` from the CLI expands
; ${...} at parse time, so neither can test this.
;
; Remove the #include line from extensions.conf when done.
;
[orata-selftest]

; DB() reads through a live channel. NoOp output lands in the verbose log.
exten => 7001,1,NoOp(SELFTEST cnam=[${DB(cnam/15551234567)}] block=[${DB(block/15558675309)}] allow=[${DB(allow/15558675309)}] sensor=[${DB(alexasensor/15551234567)}])
 same => n,Hangup()

; Confirm the press-one prompt is playable on a real channel.
exten => 7002,1,Answer()
 same => n,NoOp(SELFTEST playing custom/press-one)
 same => n,Playback(custom/press-one)
 same => n,NoOp(SELFTEST playback done)
 same => n,Hangup()

; Confirm System() backgrounding reaches orata-announce.sh.
exten => 7003,1,NoOp(SELFTEST firing announce)
 same => n,System(/usr/local/bin/orata-announce.sh "15551234567" "Mom" "" >/dev/null 2>&1 &)
 same => n,Wait(2)
 same => n,NoOp(SELFTEST announce fired)
 same => n,Hangup()

; --- inbound path drivers -------------------------------------------
; `channel originate Local/NUM@from-voipms` sets the EXTENSION to NUM but
; leaves CALLERID(num) EMPTY, so every DB(block/${CALLERID(num)}) lookup
; becomes DB(block/) and the gate logic all falls through. These set the
; caller ID first, which is what a real inbound call from voip.ms does.
;
;   7101 -> known caller (cnam=Mom)  : must SKIP the gate
;   7102 -> blocked caller           : must Hangup with NO Answer()
;   7103 -> unknown caller           : must reach Read(press-one)

exten => 7101,1,Set(CALLERID(num)=15551234567)
 same => n,NoOp(SELFTEST driving known caller)
 same => n,Goto(from-voipms,${CALLERID(num)},1)

exten => 7102,1,Set(CALLERID(num)=15558675309)
 same => n,NoOp(SELFTEST driving blocked caller)
 same => n,Goto(from-voipms,${CALLERID(num)},1)

exten => 7103,1,Set(CALLERID(num)=15559998888)
 same => n,NoOp(SELFTEST driving unknown caller)
 same => n,Goto(from-voipms,${CALLERID(num)},1)