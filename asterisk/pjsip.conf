;
; /etc/asterisk/pjsip.conf
;
; REPLACE: newyork.voip.ms with your nearest POP (check latency in the portal)
; REPLACE: 123456_trunk / CHANGEME with your voip.ms SUB-ACCOUNT credentials
; REPLACE: endpoint passwords with long random strings (pwgen -s 24)
;

;=====================================================================
; Transport
;=====================================================================

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0
local_net=192.168.0.0/16
local_net=10.0.0.0/8
; Uncomment both ONLY if the Pi is behind NAT:
;external_media_address=YOUR.WAN.IP
;external_signaling_address=YOUR.WAN.IP

;=====================================================================
; voip.ms trunk
;=====================================================================

[voipms_auth]
type=auth
auth_type=userpass
username=123456_trunk
password=CHANGEME

[voipms_aor]
type=aor
contact=sip:newyork.voip.ms:5060
qualify_frequency=60

[voipms_reg]
type=registration
transport=transport-udp
outbound_auth=voipms_auth
server_uri=sip:newyork.voip.ms
client_uri=sip:123456_trunk@newyork.voip.ms
retry_interval=60
forbidden_retry_interval=600
expiration=3600
line=yes
endpoint=voipms

[voipms]
type=endpoint
transport=transport-udp
context=from-voipms
disallow=all
allow=ulaw
allow=g722
outbound_auth=voipms_auth
aors=voipms_aor
from_user=123456_trunk
from_domain=newyork.voip.ms
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[voipms_identify]
type=identify
endpoint=voipms
match=newyork.voip.ms

;=====================================================================
; Templates — adding a device is 6 lines
;=====================================================================

[endpoint-tpl](!)
type=endpoint
context=internal
transport=transport-udp
disallow=all
allow=ulaw
allow=g722
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[auth-tpl](!)
type=auth
auth_type=userpass

[aor-tpl](!)
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30

;=====================================================================
; Endpoints
;=====================================================================

; --- PC / MicroSIP -> 101 ---
[pc](endpoint-tpl)
auth=pc
aors=pc
callerid=PC <101>
[pc](auth-tpl)
username=pc
password=REPLACE_WITH_LONG_RANDOM
[pc](aor-tpl)

; --- mobile / Groundwire -> 102 ---
[mobile](endpoint-tpl)
auth=mobile
aors=mobile
callerid=Mobile <102>
[mobile](auth-tpl)
username=mobile
password=REPLACE_WITH_LONG_RANDOM
[mobile](aor-tpl)

; --- desk phone -> 103 ---
[desk](endpoint-tpl)
auth=desk
aors=desk
callerid=Desk <103>
[desk](auth-tpl)
username=desk
password=REPLACE_WITH_LONG_RANDOM
[desk](aor-tpl)