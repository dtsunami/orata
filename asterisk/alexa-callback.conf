; Optional #tryinclude "alexa-callback.conf" in extensions.conf.
; No recording, retries, arbitrary room selection, or public entry extension.
; Watcher bounds waiting/teardown; participant timeout also bounds a crash.

[orata-alexa-offer]
; ARG1 is the original called DID; inside this Gosub EXTEN is only s.
; ARG2 is the reserved callback DID global, cross-checked against INI config.
exten => s,1,Set(AB_ACTION=NORMAL)
 same => n,AGI(${ALEXABRIDGE},offer,${ARG1},${ARG2})
 same => n,GotoIf($["${AB_ACTION}" != "WAIT"]?done)
 same => n,Set(CHANNEL(hangup_handler_push)=orata-alexa-cleanup,s,1(${AB_TOKEN},caller))
 same => n,Answer()
 same => n,Set(CONFBRIDGE(bridge,template)=default_bridge)
 same => n,Set(CONFBRIDGE(bridge,max_members)=2)
 same => n,Set(CONFBRIDGE(bridge,record_conference)=no)
 same => n,Set(CONFBRIDGE(user,template)=default_user)
 same => n,Set(CONFBRIDGE(user,admin)=no)
 same => n,Set(CONFBRIDGE(user,marked)=no)
 same => n,Set(CONFBRIDGE(user,quiet)=yes)
 same => n,Set(CONFBRIDGE(user,wait_marked)=yes)
 same => n,Set(CONFBRIDGE(user,end_marked)=yes)
 same => n,Set(CONFBRIDGE(user,music_on_hold_when_empty)=yes)
 same => n,Set(CONFBRIDGE(user,timeout)=${AB_LIMIT})
 same => n,ConfBridge(${AB_ROOM})
 same => n,AGI(${ALEXABRIDGE},result,${AB_TOKEN})
 same => n,GotoIf($["${AB_RESULT}" = "CONNECTED"]?finished)
 same => n(done),Return()
 same => n(finished),Hangup()

[orata-alexa-callback]
exten => s,1,Set(CHANNEL(hangup_handler_push)=orata-alexa-cleanup,s,1(${AB_TOKEN},callback))
 same => n,Answer()
 same => n,Set(CONFBRIDGE(bridge,template)=default_bridge)
 same => n,Set(CONFBRIDGE(bridge,max_members)=2)
 same => n,Set(CONFBRIDGE(bridge,record_conference)=no)
 same => n,Set(CONFBRIDGE(user,template)=default_user)
 same => n,Set(CONFBRIDGE(user,admin)=no)
 same => n,Set(CONFBRIDGE(user,marked)=yes)
 same => n,Set(CONFBRIDGE(user,quiet)=yes)
 same => n,Set(CONFBRIDGE(user,wait_marked)=no)
 same => n,Set(CONFBRIDGE(user,end_marked)=no)
 same => n,Set(CONFBRIDGE(user,timeout)=${AB_LIMIT})
 same => n,ConfBridge(${AB_ROOM})
 same => n,Hangup()

[orata-alexa-cleanup]
exten => s,1,AGI(${ALEXABRIDGE},cleanup,${ARG1},${ARG2})
 same => n,Return()