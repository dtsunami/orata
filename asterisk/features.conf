;
; /etc/asterisk/features.conf
;
; In-call clip recording. Press the code below during a live call to
; capture what you say into the clip library -- the same library *96
; writes to and the web UI lists.
;
; This only arms on channels where the dialplan sets DYNAMIC_FEATURES.
; See extensions.conf; it is set on inbound calls and on outbound NANP
; dialling, so the feature exists on any normal conversation.
;

[general]

[featuremap]
; Asterisk's own built-ins. Left at defaults deliberately -- blindxfer
; is #, which is also Record()'s terminator, but the two never overlap:
; a feature code is only matched while bridged, and Record() only runs
; after the bridge has been suspended.

[applicationmap]
; name => DTMF,ActivateOn,Application,Arguments
;
; self   = only the party who pressed it is taken out of the bridge.
; ^      = argument separator, because commas belong to the map itself.
;
; The other party hears silence while you record. That is inherent:
; one channel cannot both stay bridged and run Record(). Keep it short.
recordclip => 3434,self,GoSub,orata-rec^s^1