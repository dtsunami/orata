;
; /etc/asterisk/extensions.conf
;

[globals]
RINGALL=PJSIP/pc&PJSIP/mobile&PJSIP/desk
ANNOUNCE=/usr/local/bin/orata-announce.sh

; 1 = strict whitelist. Callers with no name book entry, no carrier CNAM
; and no allow/ flag are sent to vm-goodbye WITHOUT being offered the
; press-1 gate. Nobody new can ever get through on their own -- you must
; add them by hand. Off by default; the gate is the gentler filter.
STRICT=0

;=====================================================================
; Inbound from voip.ms
;=====================================================================

[from-voipms]
exten => _X.,1,NoOp(IN ${CALLERID(num)} / ${CALLERID(name)})

 ; --- blocklist -----------------------------------------------------
 ; First thing, before anything answers, rings or speaks. Deliberately
 ; does NOT Answer() -- answering confirms to a robocaller that the
 ; number is live. Let the carrier report the decline.
 same => n,GotoIf($["${DB(block/${CALLERID(num)})}" = "1"]?blocked)

 ; Resolve a spoken name: local name book first, then carrier CNAM.
 same => n,Set(CNAM=${DB(cnam/${CALLERID(num)})})
 same => n,ExecIf($["${CNAM}" = ""]?Set(CNAM=${CALLERID(name)}))

 ; Per-caller Alexa sensor, if one is mapped. Empty -> announce.sh uses
 ; ORATA_SENSOR_DEFAULT. Only consulted when ORATA_ALEXA_MODE=sensor|both.
 same => n,Set(ASENSOR=${DB(alexasensor/${CALLERID(num)})})

 ; Known name or previously whitelisted -> skip the gate.
 same => n,GotoIf($["${DB(allow/${CALLERID(num)})}" = "1"]?ring)
 same => n,GotoIf($["${CNAM}" != ""]?ring)

 ; --- robocall gate -------------------------------------------------
 ; Strict mode skips the gate entirely: unknown means rejected.
 same => n,GotoIf($["${STRICT}" = "1"]?reject)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Read(digit,custom/press-one,1,,1,7)
 same => n,GotoIf($["${digit}" = "1"]?pass:reject)
 same => n(pass),Set(DB(allow/${CALLERID(num)})=1)

 ; --- announce + ring -----------------------------------------------
 ; Backgrounded with & so Asterisk never waits on the network.
 same => n(ring),System(${ANNOUNCE} "${CALLERID(num)}" "${CNAM}" "${ASENSOR}" >/dev/null 2>&1 &)
 same => n,Dial(${RINGALL},30)
 same => n,VoiceMail(100@default,u)
 same => n,Hangup()

 same => n(reject),Playback(vm-goodbye)
 same => n,Hangup()

 same => n(blocked),NoOp(BLOCKED ${CALLERID(num)})
 same => n,Hangup()

;=====================================================================
; Outbound + internal
;=====================================================================

[internal]
; 11-digit NANP
exten => _1NXXNXXXXXX,1,Dial(PJSIP/${EXTEN}@voipms,60)
; 10-digit, prepend 1
exten => _NXXNXXXXXX,1,Dial(PJSIP/1${EXTEN}@voipms,60)
; emergency
exten => 911,1,Dial(PJSIP/911@voipms,60)
; extension-to-extension (stays local, never hits the cloud)
exten => _10X,1,Dial(PJSIP/${EXTEN},20)
; voicemail
exten => *97,1,VoiceMailMain(100@default)
; test the announcement path
exten => *99,1,Answer()
 same => n,System(${ANNOUNCE} "15551234567" "Test Caller" "" >/dev/null 2>&1 &)
 same => n,Playback(beep)
 same => n,Hangup()