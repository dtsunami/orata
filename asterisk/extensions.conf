;
; /etc/asterisk/extensions.conf
;

[globals]
RINGALL=PJSIP/pc&PJSIP/mobile&PJSIP/desk
ANNOUNCE=/usr/local/bin/orata-announce.sh
CLIPSH=/usr/local/bin/orata-clip.sh
CLIPDIR=/var/lib/orata/clips

; 1 = strict whitelist. Callers with no name book entry, no carrier CNAM
; and no allow/ flag are sent to vm-goodbye WITHOUT being offered the
; press-1 gate. Nobody new can ever get through on their own -- you must
; add them by hand. Off by default; the gate is the gentler filter.
STRICT=0

;=====================================================================
; Inbound from voip.ms
;=====================================================================

[from-voipms]
exten => _X.,1,NoOp(IN ${CALLERID(num)} / ${CALLERID(name)})

 ; --- blocklist -----------------------------------------------------
 ; First thing, before anything answers, rings or speaks. Deliberately
 ; does NOT Answer() -- answering confirms to a robocaller that the
 ; number is live. Let the carrier report the decline.
 same => n,GotoIf($["${DB(block/${CALLERID(num)})}" = "1"]?blocked)

 ; Resolve a spoken name: local name book first, then carrier CNAM.
 same => n,Set(CNAM=${DB(cnam/${CALLERID(num)})})
 same => n,ExecIf($["${CNAM}" = ""]?Set(CNAM=${CALLERID(name)}))

 ; Per-caller Alexa sensor, if one is mapped. Empty -> announce.sh uses
 ; ORATA_SENSOR_DEFAULT. Only consulted when ORATA_ALEXA_MODE=sensor|both.
 same => n,Set(ASENSOR=${DB(alexasensor/${CALLERID(num)})})

 ; Prompt files: a web-UI override if one exists, else the shipped sound.
 ; STAT() comes from func_env; if it is missing the test yields empty and
 ; the built-in wins, which is the safe direction to fail.
 same => n,Set(P_GATE=custom/press-one)
 same => n,ExecIf($["${STAT(e,${CLIPDIR}/role-press-one.wav)}" = "1"]?Set(P_GATE=${CLIPDIR}/role-press-one))
 same => n,Set(P_RECSTART=custom/rec-start)
 same => n,ExecIf($["${STAT(e,${CLIPDIR}/role-rec-start.wav)}" = "1"]?Set(P_RECSTART=${CLIPDIR}/role-rec-start))
 same => n,Set(P_RECSAVED=custom/rec-saved)
 same => n,ExecIf($["${STAT(e,${CLIPDIR}/role-rec-saved.wav)}" = "1"]?Set(P_RECSAVED=${CLIPDIR}/role-rec-saved))

 ; Owner numbers always hear the prompt, even though they are in the
 ; name book -- it is the only way to reach the 3434 announce code.
 ; Without this the skip below would send you straight to the handsets.
 same => n,GotoIf($["${DB(owner/${CALLERID(num)})}" = "1"]?gate)

 ; Known name or previously whitelisted -> skip the gate.
 same => n,GotoIf($["${DB(allow/${CALLERID(num)})}" = "1"]?ring)
 same => n,GotoIf($["${CNAM}" != ""]?ring)

 ; --- robocall gate -------------------------------------------------
 ; Strict mode skips the gate entirely: unknown means rejected.
 same => n,GotoIf($["${STRICT}" = "1"]?reject)
 ; Owners jump here, landing AFTER the strict check -- announce mode has
 ; to stay reachable when strict mode is on.
 same => n(gate),Answer()
 same => n,Wait(1)

 ; One digit only, so a real caller pressing 1 proceeds instantly. The
 ; owner code starts with 3 -- a digit nothing else here uses -- and the
 ; remaining 434 is collected below. Keeping the common path at one
 ; digit is the whole reason the code is not read in a single Read().
 same => n,Read(digit,${P_GATE},1,,1,7)
 same => n,GotoIf($["${digit}" = "1"]?pass)
 same => n,GotoIf($["${digit}" = "3"]?owner)
 same => n,Goto(reject)
 same => n(pass),Set(DB(allow/${CALLERID(num)})=1)

 ; --- announce + ring -----------------------------------------------
 ; Backgrounded with & so Asterisk never waits on the network.
 same => n(ring),System(${ANNOUNCE} "${CALLERID(num)}" "${CNAM}" "${ASENSOR}" >/dev/null 2>&1 &)
 ; Arms the 3434 in-call feature code for the bridged conversation that
 ; follows. Double underscore so it survives into the bridged channel.
 ; Separate from the gate path below -- see features.conf.
 same => n,Set(__DYNAMIC_FEATURES=recordclip)
 same => n,Dial(${RINGALL},30)
 same => n,VoiceMail(100@default,u)
 same => n,Hangup()

 ; --- owner announce mode -------------------------------------------
 ; Reached by dialling 3434 at the gate. Collect the rest of the code
 ; silently: a wrong guess is indistinguishable from a wrong keypress.
 same => n(owner),Read(rest,,3,,1,4)
 same => n,GotoIf($["${rest}" != "434"]?reject)
 ; The code alone is not authorisation. Without this any robocaller that
 ; happens to send 3434 could record and broadcast into the house.
 same => n,GotoIf($["${DB(owner/${CALLERID(num)})}" != "1"]?reject)
 same => n,NoOp(ANNOUNCE MODE ${CALLERID(num)})
 same => n,Goto(orata-record,s,1)

 same => n(reject),Playback(vm-goodbye)
 same => n,Hangup()

 same => n(blocked),NoOp(BLOCKED ${CALLERID(num)})
 same => n,Hangup()

;---------------------------------------------------------------------
; Announce mode -- record, log, broadcast, repeat.
;
; Entered from the gate by an authorised caller dialling 3434. Each
; pass: beep, speak, press # to stop. The clip is committed to the
; library, pushed to the handsets, and you are returned to the beep to
; record another. Hang up to leave.
;
; The h extension catches a recording cut short by the disconnect, so
; hanging up mid-sentence still logs what you said.
;---------------------------------------------------------------------
[orata-record]
exten => s,1,NoOp(announce mode)
 same => n,System(${CLIPSH} init)
 ; Do not arm the hangup save until the start prompt has finished.
 same => n(loop),Set(TMPCLIP=)
 same => n,Playback(${P_RECSTART})
 same => n,Set(STAMP=${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)})
 same => n,Set(TMPCLIP=${CLIPDIR}/tmp/${STAMP})
 ; # ends it. 3s of silence or 120s total also will. k keeps the file
 ; if the caller hangs up mid-recording -- the h extension commits it.
 same => n,Record(${TMPCLIP}.wav,3,120,k)
 same => n,GotoIf($["${RECORD_STATUS}" = "ERROR"]?record-failed)
 same => n,System(${CLIPSH} commit ${TMPCLIP}.wav)
 same => n,GotoIf($["${SYSTEMSTATUS}" != "SUCCESS"]?record-failed)
 ; Committed -- stop the h extension from committing it a second time.
 same => n,Set(TMPCLIP=)
 ; Backgrounded: broadcast originates calls to every handset and must
 ; not hold up the next prompt.
 same => n,System(${CLIPSH} broadcast ${STAMP} >/dev/null 2>&1 &)
 same => n,Playback(${P_RECSAVED})
 same => n,Goto(loop)

 same => n(record-failed),NoOp(Recording could not be saved: ${TMPCLIP})
 ; Leave any actual file in tmp for recovery, but do not retry on hangup.
 same => n,Set(TMPCLIP=)
 same => n,Playback(vm-sorry)
 same => n,Hangup()

exten => h,1,GotoIf($["${TMPCLIP}" = ""]?done)
 same => n,GotoIf($["${STAT(e,${TMPCLIP}.wav)}" != "1"]?done)
 same => n,GotoIf($[${STAT(s,${TMPCLIP}.wav)} <= 44]?done)
 same => n,System(${CLIPSH} commit ${TMPCLIP}.wav)
 same => n,ExecIf($["${SYSTEMSTATUS}" = "SUCCESS"]?System(${CLIPSH} broadcast ${STAMP} >/dev/null 2>&1 &))
 same => n(done),NoOp(announce mode ended)

;=====================================================================
; Outbound + internal
;=====================================================================

[internal]
; 11-digit NANP
exten => _1NXXNXXXXXX,1,Set(__DYNAMIC_FEATURES=recordclip)
 same => n,Dial(PJSIP/${EXTEN}@voipms,60)
; 10-digit, prepend 1
exten => _NXXNXXXXXX,1,Set(__DYNAMIC_FEATURES=recordclip)
 same => n,Dial(PJSIP/1${EXTEN}@voipms,60)
; emergency
exten => 911,1,Dial(PJSIP/911@voipms,60)
; extension-to-extension (stays local, never hits the cloud)
exten => _10X,1,Dial(PJSIP/${EXTEN},20)
; voicemail
exten => *97,1,VoiceMailMain(100@default)
; test the announcement path
exten => *99,1,Answer()
 same => n,System(${ANNOUNCE} "15551234567" "Test Caller" "" >/dev/null 2>&1 &)
 same => n,Playback(beep)
 same => n,Hangup()

;---------------------------------------------------------------------
; *96 -- record a clip in your own voice
;
; Speak, press # to stop, then:  1 replay  2 save  3 re-record  * cancel
; Nothing enters the library until 2 is pressed. The System() calls here
; are deliberately NOT backgrounded: the confirmation prompt must not
; play before the file has actually moved.
;
; Internal context only -- never reachable from the PSTN.
;---------------------------------------------------------------------
exten => *96,1,Answer()
 same => n,Wait(1)
 same => n,System(${CLIPSH} init)
 same => n,Set(STAMP=${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)})
 same => n,Set(TMPCLIP=${CLIPDIR}/tmp/${STAMP})

 ; Every prompt below resolves the same way: a role file assigned from the
 ; web UI if one exists, else the custom/ sound file. See PROMPT() note at
 ; the gate -- STAT() failing closed means we keep the built-in.
 same => n,Set(P_START=custom/rec-start)
 same => n,ExecIf($["${STAT(e,${CLIPDIR}/role-rec-start.wav)}" = "1"]?Set(P_START=${CLIPDIR}/role-rec-start))
 same => n,Set(P_MENU=custom/rec-menu)
 same => n,ExecIf($["${STAT(e,${CLIPDIR}/role-rec-menu.wav)}" = "1"]?Set(P_MENU=${CLIPDIR}/role-rec-menu))
 same => n,Set(P_SAVED=custom/rec-saved)
 same => n,ExecIf($["${STAT(e,${CLIPDIR}/role-rec-saved.wav)}" = "1"]?Set(P_SAVED=${CLIPDIR}/role-rec-saved))

 same => n(record),Playback(${P_START})
 ; 3s of silence or 60s total also ends it; k keeps the file on hangup
 same => n,Record(${TMPCLIP}.wav,3,60,k)
 same => n(review),Playback(${TMPCLIP})
 same => n,Read(key,${P_MENU},1,,1,8)
 same => n,GotoIf($["${key}" = "1"]?review)
 same => n,GotoIf($["${key}" = "2"]?save)
 same => n,GotoIf($["${key}" = "3"]?record)
 same => n,Goto(cancel)
 same => n(save),System(${CLIPSH} commit ${TMPCLIP}.wav)
 same => n,GotoIf($["${SYSTEMSTATUS}" != "SUCCESS"]?save-failed)
 same => n,Playback(${P_SAVED})
 same => n,Hangup()
 same => n(save-failed),Playback(vm-sorry)
 same => n,Hangup()
 same => n(cancel),System(${CLIPSH} discard ${TMPCLIP}.wav)
 same => n,Playback(vm-deleted)
 same => n,Hangup()

;---------------------------------------------------------------------
; In-call clip recorder -- reached by pressing 3434 during a call.
;
; Wired up in features.conf; armed by DYNAMIC_FEATURES above. Beep,
; speak, press # to stop. The clip lands in the same library as *96.
;
; No review menu here: you are mid-conversation and the far end is
; hearing silence. Delete it from the web UI if it came out wrong.
;---------------------------------------------------------------------
[orata-rec]
exten => s,1,NoOp(in-call clip record on ${CHANNEL})
 same => n,System(${CLIPSH} init)
 same => n,Set(STAMP=${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)})
 same => n,Set(TMPCLIP=${CLIPDIR}/tmp/${STAMP})
 same => n,Playback(beep)
 ; # stops it. 2s of silence or 30s total also will -- this runs with a
 ; live call suspended, so the caps are deliberately tight.
 same => n,Record(${TMPCLIP}.wav,2,30,k)
 same => n,System(${CLIPSH} commit ${TMPCLIP}.wav)
 same => n,GotoIf($["${SYSTEMSTATUS}" != "SUCCESS"]?save-failed)
 same => n,Set(TMPCLIP=)
 same => n,Playback(beep)
 same => n,Return()
 same => n(save-failed),Playback(vm-sorry)
 same => n,Set(TMPCLIP=)
 same => n,Return()
